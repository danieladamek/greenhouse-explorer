    refs: []
  safety_flags:
  - flag: convulsant (GABA-A antagonist)
    detail: Main toxic constituent of sage oil; epileptiform convulsions reported after prolonged use of alcoholic
      extracts or pure oil [1].
    threshold_or_limit: 3.5 mg/day (rat 14-week NOEL, UF 100) or 6.6 mg/day (NTP benchmark dose); 3-7 mg/day said
      to pose no special concern; minimise in pregnancy and children
    source_citation: EMA/HMPC public statement on thujone, EMA/HMPC/732886/2010 Rev.1 (2012)
    refs:
    - 1
    - 2
  teaching_note: The absinthe molecule. Its mechanism was only pinned down in 2000 [39], and today it is why sage
    products must declare thujone [2].
