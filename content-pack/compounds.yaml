  pharmacology:
    primary_targets: GABA-A receptor chloride channel (non-competitive antagonist, picrotoxinin-like) [39].
    mechanism: α-Thujone blocks the GABA-gated chloride channel; toxicity in mice is reversed by benzodiazepines
      and barbiturates, and it is rapidly detoxified to 7-hydroxy-α-thujone, which is 56-fold less potent [39].
      EMA cites clonic seizures in the NTP rat study as the critical endpoint [2].
    functional_notes: null
  absorption_bioavailability: Rapid hepatic metabolism to hydroxylated metabolites (in animals) [39]; human PK not
    researched.
  evidence:
  - claim: α-Thujone antagonises GABA-A receptors.
    grade: E
    test_article: isolated_compound
    test_article_detail: α-thujone, binding and electrophysiology
    population: in_vitro
    outcome_summary: Competitive inhibition of channel-blocker binding; receptor suppression in neurons.
    refs:
    - 39
    note: null
  - claim: α-Thujone causes seizures in rodents.
    grade: D
    test_article: isolated_compound
    test_article_detail: thujone, NTP 2-year and 14-week rat studies (as summarised by EMA); mouse toxicity
    population: animal
    outcome_summary: Clonic seizures are the critical endpoint for EMA limits.
    refs:
    - 2
    - 39
    note: null
