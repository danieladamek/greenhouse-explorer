  pharmacology:
    primary_targets: Benzodiazepine binding site of the GABA-A receptor (flunitrazepam displacement, Ki about 4
      µM) [36].
    mechanism: Partial ligand at the central benzodiazepine site; anxiolytic in mice without sedation or muscle
      relaxation, mild sedation only at much higher doses [36, 37]. EMA also cites antispasmodic activity on isolated
      guinea-pig ileum [10].
    functional_notes: The chamomile GAD trials tested a standardised whole-flower extract, not apigenin [57].
  absorption_bioavailability: Plant apigenin is mostly glycosides that must be hydrolysed by intestinal or bacterial
    β-glucosidases; absorbed apigenin is extensively glucuronidated/sulfated and recycled enterohepatically, and
    plasma levels after parsley were nanomolar; its oral bioavailability is characterised as low [44].
  evidence:
