- n: 3
  tier: background
  citation: >-
    EMA/HMPC. Public statement on the use of herbal medicinal products containing pulegone and menthofuran. EMA/HMPC/138386/2005 Rev.1.
    Adopted 12 Jul 2016.
  url: https://www.ema.europa.eu/en/documents/scientific-guideline/public-statement-use-herbal-medicinal-products-containing-pulegone-and-menthofuran-revision-1_en.pdf
  year: 2016
  summary: >-
    Sets a combined pulegone + menthofuran limit of 0.75 mg/kg bw/day (37.5 mg/person/day for a 50 kg adult) for lifelong exposure and
    75 mg/day for use under one year, from the NTP 3-month rat study (liver and kidney toxicity; NOAEL 37.5 mg/kg bw/day, uncertainty
    factor 50). States that bioactivation of pulegone, with menthofuran as a major metabolite, is a prerequisite for hepatotoxicity.
    Contains no statement on variation with leaf age or harvest time.
  role_here: guideline
  role_note: Pulegone/menthofuran limit and mechanism.
