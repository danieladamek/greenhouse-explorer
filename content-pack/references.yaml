  year: 2012
  summary: >-
    Derives exposure limits for thujone in herbal medicinal products from a 14-week rat gavage study and the NTP 2-year study (clonic
    seizures as the critical endpoint): 3.5 mg/day (uncertainty factor 100) and 6.6 mg/day (benchmark dose), with 3-7 mg/day stated
    to pose no special concern. Describes alpha-thujone as a rapidly acting modulator of the GABA-gated chloride channel and says use
    in pregnant women and children should be minimised.
  role_here: guideline
