  tier: background
  citation: >-
    EMA/HMPC. Public statement on the use of herbal medicinal products containing estragole. EMA/HMPC/137212/2005 Rev 1 Corr 1. Adopted
    22 Sep 2021.
  url: https://www.ema.europa.eu/en/documents/other/public-statement-use-herbal-medicinal-products-containing-estragole-revision-1_en.pdf
  year: 2021
  summary: >-
    Classifies estragole as a genotoxic carcinogen after 1'-hydroxylation and sulfoconjugation (DNA adducts; rodent hepatocellular carcinomas).
    Guidance value 0.05 mg/person/day for adults and 1.0 µg/kg bw for children up to 11 years; use above these in pregnancy, lactation
    and children is not recommended without a risk assessment. Mentions that nevadensin in basil may inhibit sulfoconjugation (a hypothetical
    matrix effect).
  role_here: guideline
