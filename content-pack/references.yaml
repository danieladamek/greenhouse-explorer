  url: https://www.ema.europa.eu/en/documents/herbal-report/final-assessment-report-salvia-officinalis-l-folium-and-salvia-officinalis-l-aetheroleum-revision-1_en.pdf
  year: 2016
  summary: >-
    HMPC assessment of sage leaf and oil. Adopts four traditional-use indications and rejects well-established use because the products
    tested (Bommer 2011 hot-flush study, Kennedy 2006 and Scholey 2008 cognition studies, Hubbert 2006 sage spray) do not correspond
    to products marketed in the EU for 10 years. Records convulsions in rats at high sage-oil doses, a toddler seizure case after home-made
    sage tea, and that pregnancy and lactation use cannot be recommended.
  role_here: guideline
  role_note: Sage indications, pregnancy statement, seizure/camphor toxicity, overview of the clinical trials.
