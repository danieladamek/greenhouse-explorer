- taxon_id: scutellaria-baicalensis
  plant_part_used: root (huang qin; kampo and TCM formulas)
  safety:
    drug_interactions:
    - with: rosuvastatin (OATP1B1 substrates)
      effect: isolated baicalin lowered rosuvastatin AUC ~9-47 %, haplotype-dependent
      evidence_grade: B
      refs:
      - 33
    pregnancy_lactation:
      statement: null
      refs: []
    allergy:
      statement: null
      refs: []
    constituents_of_concern:
    - compound_id: baicalin
      concern: OATP1B1-mediated interaction; hepatotoxicity reported with the baicalin + catechin product flavocoxid
      threshold_or_limit: null
      refs:
      - 32
      - 33
    adverse_event_history:
      statement: 'All reports found involve mixtures, with the test article named: (1) flavocoxid (Limbrel), baicalin + catechins from S. baicalensis and Acacia catechu
        - four DILIN liver-injury cases, all recovered; (2) Move Free Advanced (Chinese skullcap with glucosamine/chondroitin) - liver injury, one case with pneumonitis;
        (3) Sho-saiko-to, a seven-herb kampo formula including S. baicalensis root - hepatocellular injury (LiverTox score B) and interstitial pneumonitis described
        as uncommon (a cited review counted 19 cases), with S. baicalensis the suspected component.'
      refs:
      - 32
      - 13
      - 14
    contraindications: []
  evidence:
  - claim: A multi-herb kampo formula containing S. baicalensis root is associated with liver injury and interstitial pneumonitis.
    grade: C
    test_article: multi_herb_formula
    test_article_detail: Sho-saiko-to (7 herbs incl. Scutellaria baicalensis root)
    population: human
    outcome_summary: Case reports/series summarised by LiverTox; causal component unknown, S. baicalensis suspected.
