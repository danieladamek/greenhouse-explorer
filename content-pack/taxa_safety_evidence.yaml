- taxon_id: salvia-officinalis
  plant_part_used: leaf (tea, extracts, fresh-leaf tablets); essential oil
  safety:
    drug_interactions:
    - with: CYP2D6 substrates
      effect: 'in vitro screening suggested CYP2D6 inhibition; EMA: no conclusions could be drawn'
      evidence_grade: E
      refs:
      - 1
    - with: antidiabetic drugs (hypoglycaemia claims)
      effect: no interaction data found; EMA states 'No data available' on pharmacodynamic interactions
      evidence_grade: null
      refs:
      - 1
    pregnancy_lactation:
      statement: '''As there is no information on reproductive and developmental toxicity, the use during pregnancy and lactation cannot be recommended'' (EMA). EMA''s
        thujone statement adds that use of thujone-containing products in pregnant women and children should be minimised.'
      refs:
      - 1
      - 2
    allergy:
      statement: null
      refs: []
    constituents_of_concern:
    - compound_id: alpha-thujone
      concern: GABA-A antagonist; convulsant
      threshold_or_limit: 3.5 mg/day or 6.6 mg/day thujone (EMA derivations); 3-7 mg/day stated to pose no special concern
      refs:
      - 2
    - compound_id: beta-thujone
      concern: weaker GABA-A antagonist
      threshold_or_limit: included in thujone limits
      refs:
      - 2
      - 39
    - compound_id: camphor
      concern: convulsant at high exposure; 7-50 % of commercial sage oils
      threshold_or_limit: EMA toxicity thresholds ~5 mg/kg (insignificant) and >30 mg/kg (manifest toxicity), reported in the rosemary report
      refs:
      - 1
      - 12
    adverse_event_history:
      statement: A toddler developed tonic-clonic seizures after home-made sage tea; EMA also records epileptiform convulsions after prolonged use of alcoholic extracts
        or pure oil, and convulsions in rats at high sage-oil doses.
      refs:
      - 1
    contraindications: []
  evidence:
  - claim: A sage extract reduced menopausal hot-flush severity and overall menopausal complaints compared with placebo.
    grade: B
    test_article: named_extract
    test_article_detail: Menosan (ethanolic S. officinalis extract tablets), 4 weeks
    population: human
    outcome_summary: Menopause Rating Scale -39.2 % vs -6.3 %; hot-flush severity -55.3 % (80 randomised, 48 per protocol).
    refs:
    - 50
    note: null
  - claim: Hot-flush intensity fell during 8 weeks of a fresh sage leaf tablet in an uncontrolled study.
    grade: C
    test_article: named_extract
    test_article_detail: once-daily fresh sage leaf tablet, open multicentre, no control
    population: human
    outcome_summary: Hot-flush intensity score -50 % at 4 weeks, -64 % at 8 weeks (ITT n = 69).
    refs:
    - 49
    note: No placebo arm; EMA did not accept it for well-established use [1].
  - claim: Sage extract improved cognition in mild to moderate Alzheimer's disease over 4 months.
    grade: B
    test_article: named_extract
    test_article_detail: S. officinalis extract (drops), placebo-controlled
    population: human
    outcome_summary: Better ADAS-cog and CDR-SB than placebo (n = 42); more agitation on sage.
    refs:
    - 51
    note: Single small trial; a systematic review found benefits undermined by methodological issues and heterogeneous preparations [53].
  - claim: Dried sage leaf changed mood and alertness acutely in healthy adults.
    grade: B
    test_article: whole_herb
    test_article_detail: dried S. officinalis leaf in capsules, two amounts, crossover
    population: human
    outcome_summary: Improved mood; anxiety/alertness effects differed by amount (n = 30).
    refs:
    - 52
    note: 'Test article matters: other cognition trials used extracts, oils or S. lavandulaefolia [53].'
  - claim: A sage spray eased acute pharyngitis pain slightly more than placebo.
    grade: B
    test_article: named_extract
    test_article_detail: 15 % sage spray (Hubbert et al. 2006, as described by EMA)
    population: human
    outcome_summary: About 44 % vs 34 % pain reduction within 2 hours.
    refs:
    - 1
    note: Primary paper not read; EMA notes the concentration differs from EU-marketed products.
  - claim: Sage leaf is traditionally used for mild dyspepsia, excessive sweating, mouth/throat inflammation and minor skin inflammation.
    grade: T
    test_article: whole_herb
    test_article_detail: sage leaf preparations
    population: traditional
    outcome_summary: 'EMA: ''relief of mild dyspeptic complaints such as heartburn and bloating''; ''relief of excessive sweating''; ''relief of inflammations in
      the mouth or the throat''.'
    refs:
    - 1
    note: null
  monograph_status:
    ema_hmpc:
      exists: true
      url: https://www.ema.europa.eu/en/documents/herbal-report/final-assessment-report-salvia-officinalis-l-folium-and-salvia-officinalis-l-aetheroleum-revision-1_en.pdf
    escop:
