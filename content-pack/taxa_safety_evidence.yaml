- taxon_id: thymus-vulgaris
  plant_part_used: herb (aerial parts); combination syrups
  safety:
    drug_interactions:
    - with: CYP450 substrates
      effect: aqueous extracts inhibited CYP450 in vitro; no clinical interactions reported
      evidence_grade: E
      refs:
      - 9
    pregnancy_lactation:
      statement: '''Safety during pregnancy and lactation has not been established... use during pregnancy and lactation is not recommended'' (EMA).'
      refs:
      - 9
    allergy:
      statement: Very rare hypersensitivity; possible cross-reactivity within Lamiaceae; contact dermatitis and asthma from thyme dust; one anaphylaxis case reported.
      refs:
      - 9
    constituents_of_concern:
    - compound_id: thymol
      concern: historical vermifuge doses far above medicinal exposure caused abdominal pain and collapse
      threshold_or_limit: EMA estimates ~38 mg thymol daily from medicinal thyme use (context, not a limit)
      refs:
      - 9
    adverse_event_history:
      statement: Mostly mild gastrointestinal or skin reactions; one case of acute hepatitis after ingesting pure thyme essential oil.
      refs:
      - 9
    contraindications:
    - Hypersensitivity to thyme or other Lamiaceae [9]
  evidence:
  - claim: A thyme + ivy fluid-extract syrup reduced coughing fits in acute bronchitis faster than placebo.
    grade: B
    test_article: multi_herb_formula
    test_article_detail: fixed fluid extract combination of thyme herb and ivy leaves, 11 days
    population: human
    outcome_summary: Coughing fits -68.7 % vs -47.6 % by days 7-9 (p < 0.0001; n = 361).
    refs:
    - 56
    note: Two-herb product; not transferable to thyme alone or to thyme honey.
  - claim: Thyme herb is traditionally used in productive cough associated with cold.
    grade: T
    test_article: whole_herb
    test_article_detail: thyme herb preparations
    population: traditional
    outcome_summary: 'EMA: ''Traditional herbal medicinal product used in productive cough associated with cold''.'
    refs:
    - 9
    note: null
  monograph_status:
    ema_hmpc:
      exists: true
      url: https://www.ema.europa.eu/en/documents/herbal-report/final-assessment-report-thymus-vulgaris-l-vulgaris-zygis-l-herba_en.pdf
    escop:
      exists: null
      url: null
    who:
      exists: true
      url: https://iris.who.int/handle/10665/42052
  refs:
  - 9
  - 17
  - 56
  gaps:
  - EMA monograph URL not recorded.
  - ESCOP status not checked.
  - WHO Herba Thymi text not read (only the table of contents).
  - Thyme honey for cough not researched.
