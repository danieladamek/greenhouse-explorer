- taxon_id: mentha-x-piperita
  plant_part_used: leaf (tea); essential oil (enteric-coated capsules, cutaneous)
  safety:
    drug_interactions:
    - with: cyclosporine
      effect: peppermint oil tripled mean cyclosporine Cmax (animal data summarised by EMA)
      evidence_grade: D
      refs:
      - 6
    - with: CYP3A4 substrates
      effect: peppermint oil a moderately potent reversible CYP3A4 inhibitor in vitro
      evidence_grade: E
      refs:
      - 6
    - with: calcium-channel blockers
      effect: competitive calcium-channel antagonism by the oil in animals; effectiveness of blockers may be modified
      evidence_grade: D
      refs:
      - 6
    - with: antacids, H2 blockers, proton-pump inhibitors
      effect: may dissolve enteric-coated oil capsules early; monograph says avoid concomitant use (regulatory warning, not graded)
      evidence_grade: null
      refs:
      - 7
    pregnancy_lactation:
      statement: 'Peppermint oil: ''Safety during pregnancy and lactation has not been established... use during pregnancy and lactation is not recommended'' (EMA
        monograph).'
      refs:
      - 7
    allergy:
      statement: Hypersensitivity to peppermint oil or menthol is a contraindication; allergic reactions and contact dermatitis are listed.
      refs:
      - 7
    constituents_of_concern:
    - compound_id: pulegone
      concern: hepatotoxic after bioactivation; ≤3 % of oil by Ph. Eur.
      threshold_or_limit: pulegone + menthofuran 0.75 mg/kg bw/day (37.5 mg/person/day) lifelong; 75 mg/day <1 year
      refs:
      - 3
      - 6
    - compound_id: menthofuran
      concern: hepatotoxic metabolite of pulegone; 1-8 % of oil
      threshold_or_limit: counted with pulegone (same limit)
      refs:
      - 3
    - compound_id: menthol
      concern: reflex apnoea and laryngospasm in infants
      threshold_or_limit: oil contraindicated in children under 2 years and in children with a history of seizures
      refs:
      - 7
    adverse_event_history:
      statement: Monograph lists heartburn, perianal burning, blurred vision, nausea and vomiting with oral capsules, and rare allergic reactions including anaphylactic
        shock.
      refs:
      - 7
    contraindications:
    - 'Oral oil: liver disease, cholangitis, achlorhydria, gallstones and other biliary disorders [7]'
    - Children under 2 years; children with a history of seizures (traditional-use oil preparations) [7]
    - Hypersensitivity to peppermint oil or menthol [7]
  evidence:
  - claim: Peppermint oil improves global symptoms and abdominal pain in adults with IBS.
    grade: A
    test_article: essential_oil
    test_article_detail: enteric-coated peppermint oil capsules (NOT tea)
    population: human
    outcome_summary: 'Meta-analysis of 12 RCTs (835 patients): global symptoms RR 2.39 (NNT 3); abdominal pain RR 1.78 (NNT 4); adverse events not significantly increased.'
    refs:
    - 54
    note: EMA accepts well-established use of gastro-resistant capsules for this indication [6]. Evidence does not transfer to peppermint tea.
  - claim: Peppermint leaf is traditionally used for digestive disorders.
    grade: T
    test_article: whole_herb
    test_article_detail: peppermint leaf (herbal tea and other preparations)
    population: traditional
    outcome_summary: 'EMA traditional-use indication: ''symptomatic relief of digestive disorders such as dyspepsia and flatulence''.'
    refs:
    - 6
    note: null
  monograph_status:
    ema_hmpc:
      exists: true
      url: https://www.ema.europa.eu/en/documents/herbal-monograph/european-union-herbal-monograph-mentha-x-piperita-l-aetheroleum-revision-1_en.pdf
    escop:
      exists: null
      url: null
    who:
      exists: null
      url: null
  refs:
  - 3
  - 6
  - 7
  - 54
  gaps:
  - ESCOP and WHO monograph status not checked.
  - Peppermint leaf monograph URL not recorded (oil monograph given).
  - Cutaneous oil for tension headache (EMA well-established use) not graded; no trial read.
  as_of: '2026-09-23'
- taxon_id: melissa-officinalis
  plant_part_used: leaf (tea, extracts; topical cream)
  safety:
    drug_interactions:
    - with: thyroid hormone / TSH
      effect: aqueous extracts may inhibit TSH activity in vitro; clinical relevance unknown
      evidence_grade: E
      refs:
      - 8
    pregnancy_lactation:
      statement: '''As there is no information on reproductive and developmental toxicity the use during pregnancy and lactation cannot be recommended'' (EMA).'
      refs:
      - 8
    allergy:
      statement: Hypersensitivity to the active substance is the only contraindication listed.
      refs:
      - 8
    constituents_of_concern: []
    adverse_event_history:
      statement: No clinical signals of harm under the specified conditions of use; EMA advises a driving/machinery warning because of empirically acknowledged sedative
        properties.
      refs:
      - 8
    contraindications:
    - Hypersensitivity to the active substance [8]
  evidence:
  - claim: A lemon balm leaf extract cream shortened and eased recurrent herpes labialis episodes.
    grade: B
    test_article: named_extract
    test_article_detail: cream with 1 % Lo-701 (70:1 dry aqueous extract of Melissa leaf), topical, 5 days
    population: human
    outcome_summary: Lower combined symptom score than placebo on day 2 (n = 66).
    refs:
    - 55
    note: EMA considered this product's data not transferable to a general monograph [8].
  - claim: Single doses of a lemon balm methanol extract changed attention and self-rated calmness in healthy volunteers.
    grade: B
    test_article: named_extract
    test_article_detail: 30 % methanol dry extract (Kennedy 2002, 2004), crossover
    population: human
    outcome_summary: Improved quality of attention and increased calmness under laboratory stress in small crossover studies (n = 18-20), as summarised by EMA.
    refs:
    - 8
    note: Primary papers not read here; extracts not covered by the HMPC monograph.
  - claim: An open study of a standardised extract reported lower anxiety and insomnia scores.
    grade: C
    test_article: named_extract
    test_article_detail: Cyracos (30 % ethanol extract), open-label, no control
    population: human
    outcome_summary: Anxiety manifestations -18 %, insomnia -42 % (n = 20; uncontrolled), as summarised by EMA.
    refs:
    - 8
    note: null
  - claim: Lemon balm leaf is traditionally used for mild stress, sleep and mild digestive complaints.
    grade: T
    test_article: whole_herb
    test_article_detail: Melissa leaf preparations
    population: traditional
    outcome_summary: 'EMA: ''for relief of mild symptoms of mental stress and to aid sleep''; ''for symptomatic treatment of mild gastrointestinal complaints including
      bloating and flatulence''.'
    refs:
    - 8
    note: null
  monograph_status:
    ema_hmpc:
      exists: true
      url: https://www.ema.europa.eu/en/documents/herbal-report/final-assessment-report-melissa-officinalis-l-folium_en.pdf
    escop:
      exists: null
      url: null
    who:
      exists: null
      url: null
  refs:
  - 8
  - 55
  gaps:
  - EMA monograph URL not recorded (assessment report given).
  - ESCOP/WHO status not checked.
  - Kennedy 2002/2004 and Cases 2011 primary papers not read (EMA summary used).
