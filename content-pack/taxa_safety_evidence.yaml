- taxon_id: scutellaria-lateriflora
  plant_part_used: aerial parts (tea herb)
  safety:
    drug_interactions: []
    pregnancy_lactation:
      statement: null
      refs: []
    allergy:
      statement: null
      refs: []
    constituents_of_concern:
    - compound_id: teucrin-a
      concern: 'not a skullcap constituent: germander hepatotoxin found in adulterated ''skullcap'' products; not detected in authenticated S. lateriflora'
      threshold_or_limit: null
      refs:
      - 25
      - 30
    adverse_event_history:
      statement: LiverTox rates skullcap a 'very likely but rare' cause of liver injury (score B), with hepatocellular injury 1-12 weeks after starting, and notes
        that analysis has in some suspected cases found germander adulteration or mislabelling. Germander itself caused hepatitis with positive rechallenge in a French
        series, and its diterpenoid teucrin A reproduces the injury in mice. Authenticated S. lateriflora contains no teucrin A. Whether skullcap itself is hepatotoxic
        therefore remains unresolved.
      refs:
      - 13
      - 31
      - 30
      - 25
    contraindications: []
  evidence:
  - claim: S. lateriflora did not reduce anxiety versus placebo in healthy, mostly mildly anxious volunteers.
    grade: B
    test_article: whole_herb
    test_article_detail: S. lateriflora capsules, three times daily, 2-week crossover periods (preparation type not stated in the abstract read)
    population: human
    outcome_summary: No significant anxiety difference (p = 0.191); mood disturbance fell from baseline in both arms (n = 43).
    refs:
    - 60
    note: The only RCT found; the brief's 'freeze-dried aerial parts' description is not confirmed from the abstract.
