- taxon_id: ocimum-basilicum
  plant_part_used: leaf (culinary herb); essential oil
  safety:
    drug_interactions: []
    pregnancy_lactation:
      statement: EMA advises minimising exposure of pregnant and breastfeeding women to methyleugenol, and does not recommend estragole intake above its guidance
        value in pregnancy and lactation; these statements concern herbal medicinal products, not culinary use.
      refs:
      - 4
      - 5
    allergy:
      statement: null
      refs: []
    constituents_of_concern:
    - compound_id: estragole
      concern: genotoxic carcinogen in rodents; chemotype-dependent (minor to dominant)
      threshold_or_limit: 0.05 mg/person/day adults; 1.0 µg/kg bw children ≤11 y (EMA guidance values)
      refs:
      - 4
      - 18
    - compound_id: methyleugenol
      concern: genotoxic carcinogen in rodents; present in most cultivars grown here
      threshold_or_limit: no numerical limit; minimise in young children, pregnancy, breastfeeding (EMA)
      refs:
      - 5
      - 18
    adverse_event_history:
      statement: null
      refs: []
