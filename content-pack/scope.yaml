  snowball:
  - backward from the EMA HMPC assessment reports (their cited trials and constituent studies seeded the evidence rows)
  - backward from LiverTox Skullcap to the germander adulteration case literature
  - database occurrence rows (Dr. Duke's, KNApSAcK, LOTUS) followed to the primary paper they cite, which was then read
  inclusion:
  - a database occurrence record for the species AND a review or primary source read by the builder (curation rule)
  - human studies for any graded health statement at A-C; animal and in-vitro work admitted only at D/E and never phrased as an effect in people
  - official monographs (EMA HMPC, WHO) for grade T and for regulatory thresholds
  - English-language sources whose abstract or relevant page could be read
  exclusion:
  - 'database rows with no readable source paper (kept only as verified: false with a gap noted)'
  - citations mismatched to the compound (e.g. Duke chamomile rows citing a 1987 liquorice-oil paper)
  - evidence for multi-herb formulas transferred to a single plant
  - papers whose abstract could not be read (listed in todo.yaml, not cited)
  known_gaps:
  - PubMed, PMC and Europe PMC were blocked or rate-limited for most of the sweep; several abstracts (e.g. PubMed 25942003, Rohmer 1999, Ramadan 2006) could
    not be read and are not cited
  - 'Phenol-Explorer unreachable (TLS certificate mismatch): no polyphenol retention or content data from it'
  - 'World Flora Online unreachable (TLS/robots failure): wfo_id is null for every taxon'
  - 'NCBI Taxonomy not reachable directly (browser rate-limited, E-utilities blocked by robots.txt): taxids read from the GBIF mirror of the NCBI checklist'
  - per-query hit counts were not logged in the prototype, so every hits value is null
  - 'single-pass extraction: no quantitative value has been extracted twice (double extraction returns in P1)'
  - FooDB, COCONUT/NPASS, ChEMBL and USDA FoodData Central, listed in the requirements as sources, were not queried in this pass
