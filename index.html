<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Greenhouse Explorer — prototype for critique: the plants of the UAH MARS Research Greenhouse and their constituents. Not peer reviewed; not an official UAH resource; content current as of 2026-09-23." />
    <meta name="color-scheme" content="light dark" />
    <title>Greenhouse Explorer — prototype for critique</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bx-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
