<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Greenhouse Explorer — prototype for critique: the plants of the UAH Greenhouse and their constituents. Not peer reviewed; not an official UAH resource; content current as of 2026-09-23." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efe3c6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1712" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/web/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%brand/web/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%brand/web/apple-touch-icon.png" />
    <meta property="og:title" content="Greenhouse Explorer — prototype for critique" />
    <meta property="og:description" content="The plants of the UAH Greenhouse and what is in them. Not peer reviewed; not an official UAH resource." />
    <meta property="og:image" content="https://danieladamek.github.io/greenhouse-explorer/brand/web/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Greenhouse Explorer — prototype for critique</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bx-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
